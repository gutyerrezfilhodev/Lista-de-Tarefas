<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas e Diário</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Navegação por Abas */
    .tabs-navigation {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #2b6cb0;
    }

    .tab-btn.active {
      color: #2b6cb0;
      border-bottom-color: #2b6cb0;
    }

    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      margin-bottom: 16px;
      color: #2d3748;
    }

    /* Formulários e Listas */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      margin-bottom: 12px;
    }

    button.btn-primary {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button.btn-primary:hover {
      background-color: #2c5282;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .btn-delete {
      background: #e53e3e;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Navegação -->
    <nav class="tabs-navigation">
      <button class="tab-btn active" onclick="openTab(event, 'tab-tarefas')">Tarefas</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-diario')">Diário</button>
    </nav>

    <!-- Aba 1: Tarefas -->
    <section id="tab-tarefas" class="tab-content active">
      <h2>Minhas Tarefas</h2>
      <form id="todo-form" class="input-group" onsubmit="addTask(event)">
        <input type="text" id="todo-input" placeholder="Digite uma nova tarefa..." required>
        <button type="submit" class="btn-primary">Adicionar</button>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <!-- Aba 2: Diário -->
    <section id="tab-diario" class="tab-content">
      <h2>Meu Diário</h2>
      <form id="journal-form" onsubmit="saveJournal(event)">
        <textarea id="journal-input" placeholder="Escreva suas anotações do diário aqui..."></textarea>
        <button type="submit" class="btn-primary">Salvar Diário</button>
      </form>
    </section>
  </div>

  <script>
    // Alternância de Abas
    function openTab(event, tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Gerenciamento de Tarefas (Lendo e Mantendo LocalStorage)
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function renderTasks() {
      const list = document.getElementById('todo-list');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${task}</span>
          <button class="btn-delete" onclick="removeTask(${index})">Excluir</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask(event) {
      event.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (text) {
        tasks.push(text);
        localStorage.setItem('tasks', JSON.stringify(tasks));
        input.value = '';
        renderTasks();
      }
    }

    function removeTask(index) {
      tasks.splice(index, 1);
      localStorage.setItem('tasks', JSON.stringify(tasks));
      renderTasks();
    }

    // Gerenciamento do Diário (Lendo e Mantendo LocalStorage)
    function loadJournal() {
      const savedText = localStorage.getItem('journalText') || '';
      document.getElementById('journal-input').value = savedText;
    }

    function saveJournal(event) {
      event.preventDefault();
      const text = document.getElementById('journal-input').value;
      localStorage.setItem('journalText', text);
      alert('Diário salvo com sucesso!');
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      renderTasks();
      loadJournal();
    });
  </script>

</body>
</html>
