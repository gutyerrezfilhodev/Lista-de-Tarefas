
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tarefas - Gutyerrez Filho</title>
<style>
  :root {
    --bg: #1b1d22;
    --panel: #23262d;
    --ink: #eef0f3;
    --muted: #8a8f9a;
    --accent: #6ee7b7;
    --accent-dim: #3fae82;
    --line: #33363f;
    --danger: #e2685f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .app {
    width: 100%;
    max-width: 880px;
  }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 640px) {
    .columns {
      grid-template-columns: 1fr;
    }
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent-dim);
  }

  button.add-btn {
    background: var(--accent);
    color: #12241c;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: filter 0.15s ease;
  }

  button.add-btn:hover { filter: brightness(1.08); }

  section {
    margin-bottom: 28px;
  }

  h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  h2 .count {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    color: var(--ink);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    animation: appear 0.18s ease;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .index {
    min-width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
  }

  .check-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .check-btn:hover { background: rgba(110, 231, 183, 0.15); }

  .task-text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px;
    transition: color 0.15s ease;
  }

  .delete-btn:hover { color: var(--danger); }

  /* Done section */
  #done-list li {
    opacity: 0.6;
  }

  #done-list .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  #done-list .index {
    background: rgba(110, 231, 183, 0.1);
    color: var(--accent);
  }

  .edit-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    padding: 4px;
    transition: color 0.15s ease;
    flex-shrink: 0;
  }

  .edit-btn:hover { color: var(--accent); }

  .task-text.editing {
    display: none;
  }

  .edit-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--accent-dim);
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.95rem;
    outline: none;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    animation: appear 0.18s ease;
  }

  .modal-box p {
    margin: 0 0 20px;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .modal-actions button:hover { filter: brightness(1.1); }

  .modal-yes {
    background: var(--accent);
    color: #12241c;
  }

  .modal-no {
    background: var(--line);
    color: var(--ink);
  }
    color: var(--muted);
    font-size: 0.85rem;
    padding: 16px 0;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Lista de Tarefas - Gutyerrez Filho</h1>
  <p class="subtitle">Adicione, marque como feita e ela vai direto para a lista de concluídas.</p>

  <form id="task-form">
    <input type="text" id="task-input" placeholder="O que você precisa fazer?" autocomplete="off" required>
    <button type="submit" class="add-btn">Adicionar</button>
  </form>

  <div class="columns">
    <section>
      <h2>Pendentes <span class="count" id="pending-count">0</span></h2>
      <ul id="pending-list"></ul>
    </section>

    <section>
      <h2>Concluídas <span class="count" id="done-count">0</span></h2>
      <ul id="done-list"></ul>
    </section>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <p>Essa tarefa foi realmente concluída?</p>
    <div class="modal-actions">
      <button class="modal-yes" id="confirm-yes">Sim</button>
      <button class="modal-no" id="confirm-no">Não</button>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let doneTasks = [];
  let nextId = 1;

  const STORAGE_KEY = 'lista-de-tarefas-gutyerrez';

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, doneTasks, nextId }));
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      tasks = Array.isArray(data.tasks) ? data.tasks : [];
      doneTasks = Array.isArray(data.doneTasks) ? data.doneTasks : [];
      nextId = typeof data.nextId === 'number' ? data.nextId : 1;
      // garante que nada fique preso em modo de edição ao recarregar
      tasks.forEach(t => { t.editing = false; });
    } catch (err) {
      console.error('Não foi possível carregar as tarefas salvas:', err);
    }
  }

  const form = document.getElementById('task-form');
  const input = document.getElementById('task-input');
  const pendingList = document.getElementById('pending-list');
  const doneList = document.getElementById('done-list');
  const pendingCount = document.getElementById('pending-count');
  const doneCount = document.getElementById('done-count');

  const addBtn = document.querySelector('.add-btn');

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: nextId++, text });
    input.value = '';
    input.focus();
    render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    addTask();
  });

  addBtn.addEventListener('click', () => addTask());

  const confirmModal = document.getElementById('confirm-modal');
  const confirmYes = document.getElementById('confirm-yes');
  const confirmNo = document.getElementById('confirm-no');
  let pendingCompleteId = null;

  function askComplete(id) {
    pendingCompleteId = id;
    confirmModal.classList.add('open');
  }

  function closeModal() {
    pendingCompleteId = null;
    confirmModal.classList.remove('open');
  }

  confirmYes.addEventListener('click', () => {
    if (pendingCompleteId !== null) {
      const idx = tasks.findIndex(t => t.id === pendingCompleteId);
      if (idx !== -1) {
        const [task] = tasks.splice(idx, 1);
        doneTasks.push(task);
        render();
      }
    }
    closeModal();
  });

  confirmNo.addEventListener('click', closeModal);
  confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) closeModal();
  });

  function startEdit(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.editing = true;
    render();
  }

  function saveEdit(id, newText) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const trimmed = newText.trim();
    if (trimmed) task.text = trimmed;
    task.editing = false;
    render();
  }

  function deleteTask(id, fromDone) {
    if (fromDone) {
      doneTasks = doneTasks.filter(t => t.id !== id);
    } else {
      tasks = tasks.filter(t => t.id !== id);
    }
    render();
  }

  function render() {
    saveToStorage();

    pendingCount.textContent = tasks.length;
    doneCount.textContent = doneTasks.length;

    pendingList.innerHTML = '';
    if (tasks.length === 0) {
      pendingList.innerHTML = '<li style="all:unset"><div class="empty-msg" style="width:100%">Nenhuma tarefa pendente. Adicione uma acima.</div></li>';
    } else {
      tasks.forEach((task, i) => {
        const li = document.createElement('li');

        if (task.editing) {
          li.innerHTML = `
            <span class="index">${i + 1}</span>
            <input type="text" class="edit-input" value="${task.text.replace(/"/g, '&quot;')}">
            <button class="edit-btn" title="Salvar">&#10003;</button>
          `;
          const editInput = li.querySelector('.edit-input');
          li.querySelector('.edit-btn').addEventListener('click', () => saveEdit(task.id, editInput.value));
          editInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveEdit(task.id, editInput.value);
            if (e.key === 'Escape') { task.editing = false; render(); }
          });
          pendingList.appendChild(li);
          editInput.focus();
          editInput.select();
          return;
        }

        li.innerHTML = `
          <span class="index">${i + 1}</span>
          <button class="check-btn" title="Marcar como concluída"></button>
          <span class="task-text"></span>
          <button class="edit-btn" title="Editar">&#9998;</button>
          <button class="delete-btn" title="Excluir">&times;</button>
        `;
        li.querySelector('.task-text').textContent = task.text;
        li.querySelector('.check-btn').addEventListener('click', () => askComplete(task.id));
        li.querySelector('.edit-btn').addEventListener('click', () => startEdit(task.id));
        li.querySelector('.delete-btn').addEventListener('click', () => deleteTask(task.id, false));
        pendingList.appendChild(li);
      });
    }

    doneList.innerHTML = '';
    if (doneTasks.length === 0) {
      doneList.innerHTML = '<li style="all:unset"><div class="empty-msg" style="width:100%">Nada concluído ainda.</div></li>';
    } else {
      doneTasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="index">${i + 1}</span>
          <span class="task-text"></span>
          <button class="delete-btn" title="Excluir">&times;</button>
        `;
        li.querySelector('.task-text').textContent = task.text;
        li.querySelector('.delete-btn').addEventListener('click', () => deleteTask(task.id, true));
        doneList.appendChild(li);
      });
    }
  }

  loadFromStorage();
  render();
</script>

</body>
</html>
