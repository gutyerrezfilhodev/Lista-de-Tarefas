<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas e Diário</title>
  <style>
    /* Reset básico e estilos gerais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Navegação por Abas */
    .tabs-navigation {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #2b6cb0;
    }

    .tab-btn.active {
      color: #2b6cb0;
      border-bottom-color: #2b6cb0;
    }

    /* Conteúdo das Abas */
    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      margin-bottom: 16px;
      color: #2d3748;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Barra de Navegação -->
    <nav class="tabs-navigation">
      <button class="tab-btn active" onclick="openTab(event, 'tab-tarefas')">Tarefas</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-diario')">Diário</button>
    </nav>

    <!-- Aba 1: Tarefas (Aba Padrão) -->
    <section id="tab-tarefas" class="tab-content active">
      <h2>Minhas Tarefas</h2>
      <!-- Insira a sua lista/código de tarefas aqui -->
    </section>

    <!-- Aba 2: Diário -->
    <section id="tab-diario" class="tab-content">
      <h2>Meu Diário</h2>
      <!-- Insira o seu código do diário aqui -->
    </section>
  </div>

  <script>
    function openTab(event, tabId) {
      // Esconde o conteúdo de todas as abas
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      // Remove a seleção visual de todos os botões
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      // Ativa a aba e o botão selecionados
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
